[project]
name = "trade-seatbelt"
version = "0.1.0"
description = "Risk Gate + Auditor for simulated trading. Rules before the trade, receipts after."
requires-python = ">=3.12"
dependencies = ["orjson>=3.10", "pydantic>=2.7", "pyyaml>=6", "uvloop>=0.19"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "gate", "auditor", "client"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
